<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考 Retouch · 实验对照</title><link rel="stylesheet" href="/style.css"><script defer src="/experiments.js"></script><style>

t-shell h2{margin-bottom:14px}.experiment-shell .fact-list{margin-top:12px}@media(max-width:850px){.experiment-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.experiment-images{grid-template-columns:1fr 1fr}.experiment-images figure:last-child{grid-column:1/-1;max-width:420px;justify-self:center}.experiment-summary{grid-template-columns:1fr 1fr}.experiment-head{flex-wrap:wrap}.experiment-heading h1{font-size:27px}}@media(max-width:520px){.experiment-shell{padding:18px}.experiment-images{grid-template-columns:1fr}.experiment-images figure:last-child{grid-column:auto;max-width:none}.experiment-gallery{grid-template-columns:1fr 1fr}.experiment-head select{width:100%}.experiment-summary strong{font-size:21px}}
